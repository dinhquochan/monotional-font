name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontforge python3-fontforge

      - name: Check tag matches font version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(scripts/make-fonts.sh --version)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match font version $version in src/Monotional"
            exit 1
          fi

      - name: Make fonts
        run: scripts/make-fonts.sh

      - name: Upload archives
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: monotional-fonts
          path: release/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes are the CHANGELOG.md section for this tag.
          awk -v tag="## $GITHUB_REF_NAME" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]] || ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "Monotional $GITHUB_REF_NAME" --notes-file notes.md
